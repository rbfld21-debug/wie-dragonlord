name: Build Dragonlord profiler

on:
  workflow_dispatch:
  push:
    branches: [codex/mc-grp-get-context]
    paths:
      - tools/dragonlord_profile.rs
      - .github/workflows/build-profiler.yml

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone https://github.com/dlunch/wie.git source
          git -C source checkout 4924e28a93b0
          git -C source apply "$GITHUB_WORKSPACE/patches/MC_grpGetContext-WIE.patch"
          mkdir -p source/wie-ktf/examples
          cp tools/dragonlord_profile.rs source/wie-ktf/examples/dragonlord_profile.rs
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: source
        run: cargo build --release -p wie-ktf --example dragonlord_profile
      - uses: actions/upload-artifact@v4
        with:
          name: dragonlord-profiler-linux
          path: source/target/release/examples/dragonlord_profile
          if-no-files-found: error
